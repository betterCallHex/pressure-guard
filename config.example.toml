# Copy to ~/.config/pressure-guard/config.toml. Every key is optional.
# Coding agents and everything they start run at lower CPU priority so your input goes first;
# other apps are never touched. The rest shapes how macOS's own background services are slowed.

# Memory-pressure and heat changes wake the agent instantly; between events it scans on this schedule.
# It also scans at the stressed pace while a background service runs above runaway_cpu_percent.
calm_scan_seconds = 30
stressed_scan_seconds = 5

# A core cluster (efficiency or performance cores) at or above this % busy counts as stress,
# like memory pressure or heat. Each cluster is measured on its own, so a full set of
# efficiency cores reads as saturated even while the performance cores sit idle.
busy_cpu_percent = 90

# Under stress, background services above this CPU % are slowed.
hog_cpu_percent = 30
# Under critical memory pressure or heat, the bar drops to this CPU %.
critical_hog_cpu_percent = 10

# A background service above this CPU % for this long is slowed even on a calm Mac,
# and released only after staying below hog_cpu_percent for the same length of time.
runaway_cpu_percent = 80
runaway_seconds = 180

# Background services that are never slowed (names are case-insensitive; a trailing * matches by prefix).
protect = ["universalaccessd", "sharingd", "rapportd", "useractivityd", "callservicesd", "avconferenced",
           "identityservicesd", "bluetoothuserd", "corespeechd", "assistantd", "pressure-guard"]

# Coding agents, by program name. Each one and everything it starts runs at agent_nice (0 turns this off).
agent_programs = ["claude", "codex"]
agent_nice = 10
# Under memory pressure idle agent processes run in the background, so their memory is swapped before yours;
# busy agent work keeps every core. Under heat or a saturated core cluster all agent work runs in the background,
# on the efficiency cores.
# Everything returns to full speed after this long calm.
agent_release_after_seconds = 60
# An agent process counts as idle once it stays below this CPU % (and 1 MB/s of disk I/O) for this long.
# Agents and processes running others never count, so nothing they start is born in the background.
agent_idle_cpu_percent = 5
agent_idle_seconds = 10
# Memory counts as tight once free memory drops to this %, before macOS itself reports pressure,
# so agent memory is already queued to be swapped first when the squeeze comes (0 waits for macOS).
early_memory_free_percent = 30
# Memory counts as thrashing once macOS packs and unpacks this many MB of it a second: the Mac is short of memory
# whatever the free % says. All agent work then runs in the background, so busy agent memory is swapped before yours
# too (0 turns this off). The log shows the measured rate each time the condition changes.
thrashing_megabytes_per_second = 600
